name: 开始每日签到

on:
  workflow_dispatch:
  schedule:
    # UTC 1点30分(北京时间 9点30分)
    - cron: 30 1 * * *
  # 标星时触发工作流程
  watch:
    types: [started]

jobs:
  build:
    runs-on: ubuntu-24.04 # 明确指定系统版本，消除迁移 Notice
    steps:
      - uses: actions/checkout@v6 # 升级到 Node 24 原生版本，消除 Warning

      - name: Set up Python
        uses: actions/setup-python@v6 # 升级到 Node 24 原生版本，消除 Warning
        with:
          python-version: '3.12'
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: Run checkin
        run: |
          python3 glados.py
        env: 
          GLADOS_COOKIE: "${{ secrets.GLADOS_COOKIE }}"
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      - uses: liskin/gh-workflow-keepalive@v1 # using the workflow with default setting  
