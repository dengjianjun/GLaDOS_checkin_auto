name: 开始每日签到

on:
  workflow_dispatch:
  schedule:
    # UTC 1点30分(北京时间 9点30分)
    - cron: 30 1 * * *
  # 标星时触发工作流程
  watch:
    types: [started]

jobs:
  build:
    runs-on: ubuntu-latest # 保持使用最新的 Ubuntu 26.04
    steps:
      # 1. 将 v3 升级到 v4 或 v5，解决 Node.js 20 废弃警告
      - uses: actions/checkout@v4
      - name: Set up Python
        # 2. 升级 setup-python 插件版本
        uses: actions/setup-python@v5
        with:
          # 3. 将 3.9 升级为 Ubuntu 26 支持的现代版本（如 3.12 或 3.13）
          python-version: '3.12'
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: Run checkin
        run: |
          python3 glados.py
        env: 
          GLADOS_COOKIE: "${{ secrets.GLADOS_COOKIE }}"
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      - uses: liskin/gh-workflow-keepalive@v1 # using the workflow with default setting  
